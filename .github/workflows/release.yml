name: Release Desktop App
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag matching package.json, e.g. v0.2.20'
        required: true
        default: 'v0.2.20'
      publish:
        description: 'Publish after all platforms and update signatures pass validation'
        type: boolean
        default: false
concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Refuse changes to an already published release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            node -e "const fs=require('node:fs');if(!JSON.parse(fs.readFileSync(process.argv[1])).isDraft)throw Error('Published release artifacts are immutable; choose a new version')" "$RUNNER_TEMP/release-state.json"
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
          fi
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_args: '--target universal-apple-darwin'
          - platform: windows-latest
            rust_targets: 'x86_64-pc-windows-msvc'
            tauri_args: '--target x86_64-pc-windows-msvc'
          - platform: windows-latest
            rust_targets: 'aarch64-pc-windows-msvc'
            tauri_args: '--target aarch64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)||process.env.RELEASE_TAG!=='v'+p.version||t.version!==p.version)throw Error('Release versions do not match')"
      - run: npm ci
      - name: Regression checks
        run: npm run test:app && npm run test:research && npm run test:updater && npm run test:routing && npm run test:analytics && npx tsc -b && npm run build:desktop && cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build signed installers into a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: 'AI就活 ${{ inputs.release_tag }}'
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}
          releaseBody: |
            企業研究の記事から、デスクトップアプリで研究メモを作成できます。
            - Mac・Windowsの両方で、記事のボタンからアプリを起動
            - 起動済みのアプリにも企業名と記事URLを引き継ぎ
            - ログイン・保存先設定が必要な場合も作成待ちの記事を保持
            - 企業研究メモのひな形を作成し、同名のメモは上書きせず開く
            - 未インストール・旧版の場合のWebサイト上の案内を追加

            MacはAIshukatsu_universal.app.tar.gz、Windowsはx64またはARM64のsetup.exeを選択してください。
            初回のみ既存の保存フォルダを選び直す場合があります。更新前に作業を保存してください。
  verify-and-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify every platform before creating the update feed
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          update_dir="$RUNNER_TEMP/verified-updater"
          mkdir -p "$update_dir"
          gh release download "$RELEASE_TAG" --dir "$update_dir" --pattern '*.sig' --pattern '*.app.tar.gz' --pattern '*.exe'
          node scripts/updater-release.mjs "$update_dir" "${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "$update_dir/latest.json" --clobber
      - name: Publish the complete verified update
        if: inputs.publish == true
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
